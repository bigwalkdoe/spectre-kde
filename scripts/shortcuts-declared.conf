# spectre-kde -- declared keyboard shortcuts (desired state)
# Format: component|action|shortcut|default|description
# - component/action must match kglobalshortcutsrc groups/keys (KGlobalAccel).
# - shortcut is the binding to assert/apply (tab-separated if multiple).
# - default is KDE's default binding for that action (informational / apply target triple).
# - description is the friendly label (third element of the KGlobalAccel triple).
#
# NOTE: apply.sh deliberately does not auto-apply shortcuts (see its comment).
# Use: ./scripts/manage-shortcuts.sh status
#      ./scripts/manage-shortcuts.sh apply --yes   (explicit, writes kglobalshortcutsrc)
kwin|Overview|Meta+W|Meta+W|Toggle Overview
kwin|Grid View|Meta+G|Meta+G|Toggle Grid View
kwin|Show Desktop|Meta+D|Meta+D|Peek at Desktop
kwin|Edit Tiles|Meta+T|Meta+T|Toggle Tiles Editor
kwin|Switch One Desktop to the Left|Meta+Ctrl+Left|Meta+Ctrl+Left|Switch One Desktop to the Left
kwin|Switch One Desktop to the Right|Meta+Ctrl+Right|Meta+Ctrl+Right|Switch One Desktop to the Right
kwin|Window One Desktop to the Left|Meta+Ctrl+Shift+Left|Meta+Ctrl+Shift+Left|Window One Desktop to the Left
kwin|Window One Desktop to the Right|Meta+Ctrl+Shift+Right|Meta+Ctrl+Shift+Right|Window One Desktop to the Right
kwin|Walk Through Windows|Alt+Tab\tMeta+Tab|Alt+Tab|Walk Through Windows
kwin|Walk Through Windows (Reverse)|Alt+Shift+Tab\tMeta+Shift+Tab|Alt+Shift+Tab|Walk Through Windows (Reverse)
plasmashell|activate application launcher|Meta\tAlt+F1|Alt+F1|Activate Application Launcher
