# spectre-kde — KWin window rules (KWin-native kwinrulesrc format)
# macOS-inspired window management for Plasma 6.
#
# Rendered to ~/.config/kwinrulesrc by apply.sh through
# scripts/render-kwinrules.sh, which resolves the @DESKTOP_N@ placeholders
# below against the kwinrc [Desktops] Id_N values apply.sh manages. That keeps
# this file portable across machines instead of hardcoding desktop UUIDs.
#
# Format notes (KWin 6):
#   [General] Order=   - list of rule section names, in evaluation order
#   [n]                - one rule; Description= is its human name
#   wmclassmatch=1     - exact window-class match (2 = substring, 3 = regex)
#   desktops=ID        - target desktop id; desktopsrule=2 forces it
#   above=true         - keep window above; aboverule=2 forces it
#   decorationpolicy=none - no titlebar/frame; decorationpolicyrule=2 forces it
# Edit this file, then run ./apply.sh (or manage-kwin-rules.sh) to reapply.

[General]
Order=1,2,3,4,5,6,7

# --- Terminal: clean borderless window -------------------------------------
[1]
Description=Konsole - borderless
wmclass=konsole
wmclassmatch=1
decorationpolicy=none
decorationpolicyrule=2

# --- Web: browsers on desktop 2 --------------------------------------------
[2]
Description=Firefox - desktop 2
wmclass=firefox
wmclassmatch=1
desktops=@DESKTOP_2@
desktopsrule=2

[3]
Description=Google Chrome - desktop 2
wmclass=google-chrome
wmclassmatch=1
desktops=@DESKTOP_2@
desktopsrule=2

# --- Development: editors on desktop 3 -------------------------------------
[4]
Description=Code - desktop 3
wmclass=code
wmclassmatch=1
desktops=@DESKTOP_3@
desktopsrule=2

[5]
Description=Obsidian - desktop 3
wmclass=obsidian
wmclassmatch=1
desktops=@DESKTOP_3@
desktopsrule=2

# --- Music: always on top --------------------------------------------------
[6]
Description=Spotify - keep above
wmclass=spotify
wmclassmatch=1
above=true
aboverule=2

# --- Messaging: keep above -------------------------------------------------
[7]
Description=Telegram - keep above
wmclass=org.telegram.desktop
wmclassmatch=1
above=true
aboverule=2
