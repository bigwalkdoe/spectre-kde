# spectre-kde — declarative KWin window rules
# macOS-inspired window management for Plasma 6
#
# Format: one [Rule Name] section per rule. Matching keys:
#   wmclass   - application class (e.g. "konsole", "firefox")
#   title     - window title regex (optional)
#   desktop   - force window to this desktop number (1-4)
# Behavior keys:
#   noblord     true  - no window border
#   keepabove   true  - always on top
#   skippager   true  - skip pager/taskbar preview
#   skiptaskbar true  - skip taskbar entry
#   maximize    true  - start maximized
#   fullscreen  true  - start fullscreen
# Applied by apply.sh to ~/.config/kwinrulesrc. Backup/restore is automatic
# (kwinrulesrc is already in backup.sh FILES and restore-backup.sh AFFECTED).
# Edit this file, then run ./apply.sh to reapply.

# --- Terminal: clean borderless window on the main desktop -----------------
[Konsole - borderless]
wmclass=konsole
noblord=true
description=Borderless terminal (clean macOS look)

# --- Web: browser on desktop 2 -------------------------------------------
[Firefox - desktop 2]
wmclass=firefox
desktop=2
description=Firefox always opens on desktop 2

[Google Chrome - desktop 2]
wmclass=google-chrome
desktop=2
description=Chrome always opens on desktop 2

# --- Development: editor on desktop 3 -------------------------------------
[Code - desktop 3]
wmclass=code
desktop=3
description=VS Code always opens on desktop 3

[Obsidian - desktop 3]
wmclass=obsidian
desktop=3
description=Obsidian notes always opens on desktop 3

# --- Music: always on top, small floating ----------------------------------
[Spotify - keep above]
wmclass=spotify
keepabove=true
description=Spotify stays on top for quick control

# --- Messaging: keep above, skip taskbar -----------------------------------
[Telegram - keep above]
wmclass=org.telegram.desktop
keepabove=true
description=Telegram stays on top for quick replies
