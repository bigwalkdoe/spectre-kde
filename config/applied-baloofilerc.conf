# spectre-kde -- applied Baloo file indexing settings
# Generated by apply.sh; tracked for verification.
# Baloo 6.31 reads EXACTLY these keys (src/lib/baloosettings.kcfg):
#   folders[$e], exclude folders[$e], "exclude filters"/version.
# The space-less camelCase spellings are keys Baloo never reads: apply once
# wrote `excludeFolders=`/`excludeFilters=` and the indexer could gain no
# include list at all, spinning "Failed to add include folder config entry"
# against the file forever. These tests freeze the canonical shape so the
# template cannot drift back into a key the engine ignores.
# Conservative defaults: index only the home root, exclude common noise.

[General]
# Include list: home root only.
folders[$e]=@HOME@/

# Exclude folders (canonical spaced key, trailing slash per entry).
exclude folders[$e]=@HOME@/.cache/,@HOME@/.local/share/Trash/,@HOME@/Downloads/,@HOME@/.local/share/Steam/,@HOME@/.var/app/,@HOME@/.flatpak/,@HOME@/.config/google-chrome/,@HOME@/.config/chromium/,@HOME@/.config/BraveSoftware/,@HOME@/.config/Vivaldi/,@HOME@/.config/mozilla/,@HOME@/.thunderbird/,@HOME@/.mozilla/,@HOME@/VirtualBox VMs/,@HOME@/.local/share/virtualbox/

# Exclude patterns (glob syntax) - stored under the versioned key.
"exclude filters"[$e]=*~,#*#,*.tmp,*.temp,*.o,*.lo,*.la,*.al,.libs,*.so,*.so.[0-9]*,*.a,[mM]akefile,*.orig,*.rej,*.bak,*bak,*.swp,*.swo,*.tmp,*.cache,*.lock,.git,.hg,.svn,.bzr,CVS,__pycache__,*.pyc,*.pyo,*.class,*.jar,*.war,*.ear,node_modules,.npm,.yarn,bower_components,target,.gradle,.maven,dist,build,out,bin,obj,.vs,.idea,.vscode,*.swp,*.swo,*~,*.bak,*.orig,*.rej,*.log,*.cache,*.lock
version=2