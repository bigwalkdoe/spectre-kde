name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck (all shell scripts, fail on warning or higher)
        run: shellcheck -S warning *.sh scripts/*.sh

      - name: bash syntax check
        run: bash -n *.sh scripts/*.sh

  test-suites:
    name: all test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every scripts/test-*.sh suite stubs the external KDE tools it needs
      # (kreadconfig6, qdbus6, btrfs, journalctl, ...) and runs in a temp dir,
      # so no live Plasma session is required. The runner discovers the suites,
      # which means a newly added test-*.sh file is picked up automatically.
      - name: run all test suites
        run: timeout 900 bash scripts/run-tests.sh
