name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck (all shell scripts, fail on warning or higher)
        run: |
          shellcheck -S warning \
            apply.sh backup.sh detect.sh rollback.sh sync.sh verify.sh \
            menu.sh quick-update.sh reset.sh install-deps.sh \
            scripts/*.sh

      - name: bash syntax check
        run: |
          bash -n \
            apply.sh backup.sh detect.sh rollback.sh sync.sh verify.sh \
            menu.sh quick-update.sh reset.sh install-deps.sh \
            scripts/*.sh

  test-verify:
    name: verify.sh log-reading health checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # verify.sh needs a live Plasma session, so it cannot run here. This
      # exercises the health checks that read a log, by putting stub
      # journalctl / fc-cache executables ahead of PATH and asserting the
      # verdicts. The rest of verify.sh legitimately fails on a runner; only
      # the health lines are asserted, which is why its result line is ignored.
      # Bounded so a hung probe fails the job instead of stalling it.
      - name: run test-verify.sh
        run: timeout 300 bash scripts/test-verify.sh

  test-check-storage:
    name: check-storage.sh scrub parsing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real scrub needs root and a btrfs filesystem, neither of which a
      # runner has. The test stubs btrfs / findmnt / id / journalctl ahead of
      # PATH so the parser runs against real btrfs output without either.
      - name: run test-check-storage.sh
        run: timeout 300 bash scripts/test-check-storage.sh
